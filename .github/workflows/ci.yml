name: CI

# Enforces the build gates documented in AGENTS.md and SENIOR_GD_REVIEW.md:
# the backend must compile and pass its domain tests, and the Next.js frontend
# must produce a production build (which also type-checks the app).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osloville-multi/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: osloville-multi/backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test dist/tests/*.test.js

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osloville-multi/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: osloville-multi/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
